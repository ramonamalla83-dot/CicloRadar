<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CicloRadar - Seguridad y Comunidad para Ciclistas</title>
    <meta name="description" content="Aplicación social y de seguridad para ciclistas con mapas en tiempo real, alarmas SOS del sistema y comunidad." />
    <meta property="og:title" content="CicloRadar" />
    <meta property="og:description" content="Aplicación social y de seguridad para ciclistas con mapas en tiempo real, alarmas SOS del sistema y comunidad." />
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CicloRadar" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
  </head>
  <body class="bg-zinc-950 text-white select-none">
    <div id="root"></div>
    <script>
      // Interceptor OAuth para Popups (Strava, Garmin, iGPSPORT)
      if (window.location.pathname.startsWith('/auth/callback')) {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state') || 'strava';
        const error = urlParams.get('error');

        if (window.opener) {
          window.opener.postMessage({
            type: 'OAUTH_AUTH_SUCCESS',
            code,
            provider: state,
            error
          }, '*');
          window.close();
        } else {
          window.location.href = '/';
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
